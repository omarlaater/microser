apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: micro-template
  labels:
    app: service-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: your-dockerhub-user/service-b:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_A_BASE_URL
              value: http://service-a:8080
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: micro-template
  labels:
    app: service-b
spec:
  selector:
    app: service-b
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
