spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.routes[0].id=service-a
spring.cloud.gateway.routes[0].uri=${SERVICE_A_URL:http://service-a:8080}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/a/**

spring.cloud.gateway.routes[1].id=service-b
spring.cloud.gateway.routes[1].uri=${SERVICE_B_URL:http://service-b:8080}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/b/**

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=api-gateway
info.app.description=Gateway service for the k8s microservices template
